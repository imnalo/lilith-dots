# ======================================================================
#  palette.conf — the ONE source of truth for every colour
# ----------------------------------------------------------------------
#  Plain shell assignments, 6-digit hex without '#'.
#  Copied to ~/.config/lilith-rice/palette.conf on install; edit THAT copy, then run lilith-theme.
#  Feeds: compositor borders + bar, foot, and live recolouring of open terminals.
#  The wallpaper pipeline (milestone 2) will overwrite the user copy automatically.
# ======================================================================

# --- base ---------------------------------------------------------------
background=101312
foreground=c9d1ce
accent=7fcfc0            # borders, selected tag, rope, highlights
urgent=d4756b            # urgent windows, low battery, warnings
dim=4a5350               # unfocused borders, muted text

# --- 16-colour terminal palette ------------------------------------------
color0=101312
color1=d4756b
color2=8fbf9f
color3=d9c27e
color4=7aa7c7
color5=b58fc4
color6=7fcfc0
color7=c9d1ce
color8=4a5350
color9=e08f86
color10=a6d1b5
color11=e6d49a
color12=95bdd8
color13=c8a8d4
color14=9ae0d2
color15=eef2f0

# --- UI scale ------------------------------------------------------------
# 1 = native 2560x1440. Try 1.25 or 1.5 for bigger everything (compositor-wide, fractional ok).
scale=1

# --- fonts ---------------------------------------------------------------
# Terminal, bar and menus. `lilith-rice fonts` installs it; use any installed family.
font="Gallant Raster Term"
font_size=12

# --- wallpaper (absolute path; empty = none; default = wallhaven 39lg2d) ----
wallpaper="$HOME/Pictures/Wallpapers/wallhaven-39lg2d.jpg"
