# ======================================================================
#  10-lilith.conf — elogind: lid, power button, no idle
# ----------------------------------------------------------------------
#  Installed to /etc/elogind/logind.conf.d/ by `lilith-rice config`. Applies after a reboot.
#  Closing the lid suspends; reopening resumes straight into the session (no lock screen).
# ======================================================================

[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
HandlePowerKey=poweroff
HandleSuspendKey=suspend
IdleAction=ignore
