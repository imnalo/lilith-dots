<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ======================================================================
      fonts.conf: system fonts: Gallant Raster Term everywhere, then JetBrains Mono / Space Grotesk
     ======================================================================
      Lives at ~/.config/fontconfig/fonts.conf (symlink to this file).
      After edits run: fc-cache -f
      The terminal, bar and menus use the font in palette.conf; GTK apps and fallbacks use this file. -->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Gallant Raster Term</family>
      <family>gallant</family>
      <family>JetBrains Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Gallant Raster Term</family>
      <family>gallant</family>
      <family>Space Grotesk</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
