# ======================================================================
#  yazi.toml — yazi file manager: layout, sorting, previews
# ----------------------------------------------------------------------
#  Lives at ~/.config/yazi/yazi.toml (symlink to this file). Applies on next start.
# ======================================================================

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false
show_symlink   = true

[preview]
max_width  = 1200
max_height = 1400
