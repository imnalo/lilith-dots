# ======================================================================
#  foot.ini — foot terminal: padding, mouse, scrollback
# ----------------------------------------------------------------------
#  Lives at ~/.config/foot/foot.ini (symlink to this file). New terminals pick up edits.
#  Font and colours come from colors.ini, generated by lilith-theme (from palette.conf).
# ======================================================================

[main]
include=~/.config/foot/colors.ini
pad=12x10

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
