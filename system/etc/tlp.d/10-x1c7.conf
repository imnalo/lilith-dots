# ======================================================================
#  10-x1c7.conf — tlp tuning for ThinkPad X1 Carbon Gen 7 (i7-8565U)
# ----------------------------------------------------------------------
#  Installed to /etc/tlp.d/ by `lilith-rice config`. Applies after a reboot or `sudo tlp start`.
# ======================================================================

CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
# Battery care (thinkpad_acpi): stop charging at 80% to preserve the cell.
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
